# ESP32-S3 Configuration for PCD68 Emulator

# Board configuration
CONFIG_SOC_SERIES_ESP32S3=y

# System
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_BUFFER_SIZE=2048

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# SPI for Display
CONFIG_SPI=y
CONFIG_SPI_ESP32_SPIM=y
CONFIG_GPIO=y

# Display Subsystem
CONFIG_DISPLAY=y
CONFIG_FRAMEBUFFER=y

# LCD Display Drivers (choose one)
CONFIG_ILI9341=y
CONFIG_ILI9341_RGB565=n  # We'll use monochrome
# CONFIG_ST7735R=y
# CONFIG_SSD1306=y

# E-paper Display Drivers (choose one for E-paper)
# CONFIG_SSD16XX=y               # Generic SSD16xx E-paper controller
# CONFIG_GOOD_DISPLAY_GDEY042T81=y  # Waveshare 4.2" E-paper (400x300)
# CONFIG_GOOD_DISPLAY_GDEY029T94=y  # Waveshare 2.9" E-paper
# CONFIG_SSD1680=y               # SSD1680 E-paper controller
# CONFIG_SSD1681=y               # SSD1681 E-paper controller

# Display Buffer Configuration
CONFIG_DISPLAY_BUFFER_SIZE=32768   # Adjust based on display size

# USB Support for keyboard
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y

# Flash & Storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# File Systems
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Timing
CONFIG_COUNTER=y
CONFIG_TIMER=y

# Memory
CONFIG_MINIMAL_LIBC_MALLOC_ARENA_SIZE=16384

# PCD68 Specific Configuration
CONFIG_PCD68_RAM_SIZE_MB=4
CONFIG_PCD68_ROM_SIZE_KB=64

# Display Configuration (LCD vs E-paper)
CONFIG_PCD68_ENABLE_EINK_EMULATION=n        # Set to 'y' for E-paper displays
CONFIG_PCD68_EINK_PARTIAL_REFRESH=y         # Enable partial refresh for E-paper
CONFIG_PCD68_EINK_REFRESH_RATE_MS=2000      # 2 second refresh rate for E-paper
CONFIG_PCD68_EINK_PARTIAL_THRESHOLD=25      # 25% change threshold for partial refresh
CONFIG_PCD68_EINK_GHOSTING_EMULATION=n      # Disable ghosting emulation for performance

CONFIG_PCD68_DISPLAY_DRIVER="ILI9341"       # Change to "SSD16XX" for E-paper
CONFIG_PCD68_DISPLAY_SPI_FREQUENCY=40000000

# Input Configuration
CONFIG_PCD68_KEYBOARD_TYPE="USB_HID"

# Peripheral Configuration
CONFIG_PCD68_ENABLE_UART1=y
CONFIG_PCD68_ENABLE_UART2=n

# Storage Configuration
CONFIG_PCD68_STORAGE_TYPE="LITTLEFS"
CONFIG_PCD68_DEFAULT_ROM="jonsharp.bin"

# CPU Emulation Configuration
CONFIG_PCD68_CPU_THROTTLE=y
CONFIG_PCD68_TARGET_CPU_MHZ=8
CONFIG_PCD68_DEBUG_LEVEL=1

# Optional: WiFi support
# CONFIG_WIFI=y
# CONFIG_WIFI_ESP32=y
# CONFIG_NET_L2_ETHERNET=y
# CONFIG_NET_DHCPV4=y

# Optional: Bluetooth support for wireless keyboard
# CONFIG_BT=y
# CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_DEVICE_NAME="PCD68-Keyboard"

# Power Management
CONFIG_PM=n  # Disable for consistent emulation performance

# Watchdog
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y