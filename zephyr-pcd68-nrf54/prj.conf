# nRF54H20-DK Configuration for PCD68 Model 4 CyberTerminal

# Board configuration - let west handle board selection

# System - minimal for flash size
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=8192

# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Logging - verbose for debugging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=y
# Log string duplication settings (removed - not available in this version)

# Console - enabled for debugging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
# RTT console for J-Link debugging - disabled due to dependency issues
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_RTT_CONSOLE=y

# SPI for Display
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_GPIO=y

# Display Subsystem - temporarily disabled due to ST7796S driver compatibility
CONFIG_DISPLAY=n

# ST7796S LCD Display Driver (4" 480x320) - temporarily disabled
# CONFIG_ST7796S=y

# Bluetooth Support - temporarily disabled to save flash
# Will re-enable after getting basic emulator working
CONFIG_BT=n
# CONFIG_BT_CENTRAL=y
# CONFIG_BT_GATT_CLIENT=y
# CONFIG_BT_DEVICE_NAME="PCD68-Model4"
# CONFIG_BT_DEVICE_APPEARANCE=768
# CONFIG_BT_MAX_CONN=1
# CONFIG_BT_MAX_PAIRED=1
# CONFIG_BT_HOGP=y
# CONFIG_BT_HOGP_REPORTS_MAX=1
# CONFIG_BT_SCAN=y
# CONFIG_BT_SCAN_FILTER_ENABLE=n
# CONFIG_BT_SCAN_UUID_CNT=1
# CONFIG_BT_GATT_DM=y
# CONFIG_BT_SETTINGS=n
# CONFIG_BT_SMP=n
# CONFIG_BT_PRIVACY=n

# Flash & Storage - minimal (no persistent settings needed)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# Disable NVS and Settings subsystem to save space
CONFIG_NVS=n
CONFIG_SETTINGS=n

# File Systems - temporarily disabled to save space
# CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_LITTLEFS=y
# CONFIG_FILE_SYSTEM_MKFS=y

# Timing
CONFIG_COUNTER=y

# Debug configuration for J-Link debugging
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_INFO=y
# Enable debug symbols and DWARF debugging

# PCD68 Specific Configuration - reduced for nRF54H20
CONFIG_PCD68_RAM_SIZE_MB=1
CONFIG_PCD68_ROM_SIZE_KB=32

# Display Configuration
CONFIG_PCD68_ENABLE_EINK_EMULATION=n
CONFIG_PCD68_DISPLAY_DRIVER="ST7796S"
CONFIG_PCD68_DISPLAY_SPI_FREQUENCY=40000000

# Input Configuration - stub for now
CONFIG_PCD68_KEYBOARD_TYPE="STUB"

# Peripheral Configuration
CONFIG_PCD68_ENABLE_UART1=y
CONFIG_PCD68_ENABLE_UART2=n

# Storage Configuration
CONFIG_PCD68_STORAGE_TYPE="LITTLEFS"
CONFIG_PCD68_DEFAULT_ROM="frst_net.bin"

# CPU Emulation Configuration - Higher performance for Cortex-M33
CONFIG_PCD68_CPU_THROTTLE=y
CONFIG_PCD68_TARGET_CPU_MHZ=12
CONFIG_PCD68_DEBUG_LEVEL=3
CONFIG_PCD68_USE_LIGHTWEIGHT_VM=n

# Power Management (disabled for consistent emulation)
CONFIG_PM=n

# Watchdog - disable to save space
CONFIG_WATCHDOG=n

# Nordic nRF54H20 specific
CONFIG_NORDIC_QSPI_NOR=n

# Disable unnecessary Zephyr subsystems to save flash space (safe options only)
CONFIG_POSIX_API=n
CONFIG_REQUIRES_FULL_LIBC=n
CONFIG_NEWLIB_LIBC=n

# Enable debugging features
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER=y
# Enable kernel object tracing for debugging - disabled (not available in this Zephyr version)
# CONFIG_OBJECT_TRACING=y

# Enable shell for debugging
CONFIG_SHELL=y
# Boot banner disabled due to dependency conflicts
# CONFIG_BOOT_BANNER=y
# Shell history for easier debugging
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=512

# Disable advanced timing features not needed
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_TICKLESS_KERNEL=n

# Disable additional features to save space
CONFIG_TEST=n
CONFIG_ZTEST=n
CONFIG_COVERAGE=n
CONFIG_INPUT=n

# Minimal interrupt handling
CONFIG_DYNAMIC_INTERRUPTS=n
CONFIG_GEN_IRQ_VECTOR_TABLE=y
CONFIG_IRQ_OFFLOAD=n

# Disable other non-essential features
CONFIG_PIPES=n
CONFIG_STACK_CANARIES=n