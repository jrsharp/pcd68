# nRF54H20-DK Debug Configuration for PCD68 Model 4 CyberTerminal

# Board configuration - let west handle board selection

# System - debug-friendly
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384

# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Logging - verbose for debugging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048

# Console - enabled for debugging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# RTT for debugging
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

# SPI for Display
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_GPIO=y

# Display Subsystem
CONFIG_DISPLAY=y

# Flash & Storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=n
CONFIG_SETTINGS=n

# Timing
CONFIG_COUNTER=y

# Debug configuration - minimal but effective
CONFIG_DEBUG_INFO=y
CONFIG_SIZE_OPTIMIZATIONS=n

# PCD68 Specific Configuration
CONFIG_PCD68_RAM_SIZE_MB=1
CONFIG_PCD68_ROM_SIZE_KB=32

# Display Configuration
CONFIG_PCD68_ENABLE_EINK_EMULATION=n
CONFIG_PCD68_DISPLAY_DRIVER="ST7796S"
CONFIG_PCD68_DISPLAY_SPI_FREQUENCY=40000000

# Input Configuration - stub for initial testing
CONFIG_PCD68_KEYBOARD_TYPE="STUB"

# Peripheral Configuration
CONFIG_PCD68_ENABLE_UART1=y
CONFIG_PCD68_ENABLE_UART2=n

# Storage Configuration
CONFIG_PCD68_STORAGE_TYPE="LITTLEFS"
CONFIG_PCD68_DEFAULT_ROM="frst_net.bin"

# CPU Emulation Configuration
CONFIG_PCD68_CPU_THROTTLE=y
CONFIG_PCD68_TARGET_CPU_MHZ=12
CONFIG_PCD68_DEBUG_LEVEL=3
CONFIG_PCD68_USE_LIGHTWEIGHT_VM=n

# Power Management (disabled for consistent emulation)
CONFIG_PM=n

# Watchdog - disable to save space
CONFIG_WATCHDOG=n

# Nordic nRF54H20 specific
CONFIG_NORDIC_QSPI_NOR=n

# Enable basic debugging features
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_SHELL=y
CONFIG_BOOT_BANNER=y

# Disable unnecessary subsystems for cleaner debug
CONFIG_POSIX_API=n
CONFIG_REQUIRES_FULL_LIBC=n
CONFIG_NEWLIB_LIBC=n
CONFIG_TICKLESS_KERNEL=n
CONFIG_TEST=n
CONFIG_ZTEST=n
CONFIG_COVERAGE=n
CONFIG_INPUT=n
CONFIG_DYNAMIC_INTERRUPTS=n
CONFIG_GEN_IRQ_VECTOR_TABLE=y
CONFIG_IRQ_OFFLOAD=n
CONFIG_PIPES=n
CONFIG_STACK_CANARIES=n