# FRST.net Aether Test Network BBS - Nginx Configuration
# Place this in /etc/nginx/nginx.conf or include it in your existing configuration

server {
    listen       80;
    listen       [::]:80;
    server_name  aether.frstcomputer.net;
    
    # Document root - adjust this path to where you deploy the files
    root         /var/www/htdocs/aether.frstcomputer.net;
    index        index.html;
    
    # Logging
    access_log   /var/www/logs/aether_access.log;
    error_log    /var/www/logs/aether_error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # WebAssembly MIME types
    location ~ \.wasm$ {
        add_header Content-Type application/wasm;
        # Enable CORS for WASM if needed
        add_header Access-Control-Allow-Origin *;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Main application
    location / {
        try_files $uri $uri/ /index.html;
        
        # CORS headers for the emscripten app
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }
    
    # ROM files (if you want to serve them directly)
    location /roms/ {
        add_header Content-Type application/octet-stream;
        add_header Content-Disposition 'attachment';
    }
    
    # Emscripten memory files
    location ~ \.(data|mem)$ {
        add_header Content-Type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
    }
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/wasm;
}

# Redirect www to non-www
server {
    listen       80;
    listen       [::]:80;
    server_name  www.aether.frstcomputer.net;
    return       301 http://aether.frstcomputer.net$request_uri;
}