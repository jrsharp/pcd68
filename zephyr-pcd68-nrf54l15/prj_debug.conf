# PCD68 nRF54L15 Debug Configuration

# Basic system configuration
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Memory and threading
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# C++ support
CONFIG_CPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Console and logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4

# Display subsystem for e-paper
CONFIG_DISPLAY=y
CONFIG_SPI=y

# GPIO for display control
CONFIG_GPIO=y

# Debug settings
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_ASSERT=y

# PCD68 debug options
CONFIG_PCD68_DEBUG_TIMING=y

# Stack protection
CONFIG_STACK_SENTINEL=y

# Flash settings optimized for nRF54L15 RRAM
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# E-paper display support
CONFIG_PCD68_EPAPER_DISPLAY=y