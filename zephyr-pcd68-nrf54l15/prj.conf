# PCD68 nRF54L15 Configuration

# Basic system configuration - reduced for nRF54L15 but with stack protection
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Memory and threading - minimal heap since we use switch dispatch instead of exec table
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_THREAD_NAME=n
CONFIG_THREAD_STACK_INFO=n

# C++ support - minimal
CONFIG_CPP=y
CONFIG_NEWLIB_LIBC=n
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=n

# C++ standards
CONFIG_STD_CPP17=y

# Reduce code size
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_C99_FORMATS=n

# Console and logging - minimal for production
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=n

# Display subsystem for UC8176 e-paper - DISABLED FOR UART DEBUGGING
# CONFIG_DISPLAY=y
# CONFIG_SPI=y
# CONFIG_SPI_ASYNC=y
# CONFIG_MIPI_DBI=y

# GPIO for display control - DISABLED FOR UART DEBUGGING
# CONFIG_GPIO=y

# Optimization settings for nRF54L15 - size optimization but less aggressive compiler flags
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_DEBUG_THREAD_INFO=n

# Additional memory optimizations for nRF54L15
CONFIG_DYNAMIC_THREAD=n
CONFIG_NET_BUF_POOL_USAGE=n
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_USERSPACE=n
CONFIG_ASSERT=n

# Compiler optimizations - size with gentler flags for C++ compatibility
CONFIG_COMPILER_OPT="-Os -fno-aggressive-loop-optimizations"

# Stack protection - enable for debugging C++ issues
CONFIG_STACK_SENTINEL=y

# Flash settings optimized for nRF54L15 RRAM
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Bluetooth (disabled for now to save space)
# CONFIG_BT=n