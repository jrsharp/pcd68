<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>PCD-68</title>
    <style>
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten { font-family: monospace; width: 80%; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; }

      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(0,150,240);
        border-right: 10px solid rgb(0,150,240);
        border-bottom: 10px solid rgb(0,150,240);
        border-top: 10px solid rgb(100,0,200);
        border-radius: 100%;
        background-color: rgb(200,100,250);
      }
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }
      
      .keyboard-notice {
        margin: 10px auto;
        padding: 5px;
        border: 1px solid #ccc;
        background-color: #f8f8f8;
        max-width: 600px;
        text-align: center;
        font-family: Arial, sans-serif;
      }
      
      .keyboard-notice.focus {
        background-color: #e8ffe8;
        border-color: #4CAF50;
      }
      
      .keyboard-notice.no-focus {
        background-color: #ffe8e8;
        border-color: #f44336;
      }
      
      .rom-selector {
        margin: 10px auto;
        padding: 5px;
        border: 1px solid #ccc;
        background-color: #f8f8f8;
        max-width: 600px;
        text-align: center;
        font-family: Arial, sans-serif;
      }
      
      .rom-selector select {
        padding: 5px;
        margin: 5px;
        border-radius: 4px;
      }
      
      .rom-selector button {
        padding: 5px 10px;
        margin: 5px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      
      .rom-selector button:hover {
        background-color: #45a049;
      }
    </style>
    <link rel="stylesheet" href="pcd68-home.css">
  </head>
  <body>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"><strong>emscripten</strong></center></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>  
    </div>
    <div>
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="400" height="300"></canvas>
    </div>
    <div id="keyboard-notice" class="keyboard-notice no-focus">
      Click the screen to enable keyboard input
    </div>
    <div id="rom-selector" class="rom-selector">
      <label for="rom-select">Select ROM:</label>
      <select id="rom-select">
        <option value="internal">JonSharp.net Homepage (Default)</option>
        <option value="roms/text_demo.bin">JonSharp.net Homepage (external)</option>
        <option value="roms/uart_test.bin">UART Test</option>
        <option value="roms/display_test.bin">Display Test</option>
        <option value="roms/keyboard_test.bin">Keyboard Test</option>
      </select>
      <button id="load-rom">Load ROM</button>
    </div>
    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var keyboardNotice = document.getElementById('keyboard-notice');
      var canvas = document.getElementById('canvas');
      var romSelect = document.getElementById('rom-select');
      var loadRomButton = document.getElementById('load-rom');
      
      // Track canvas focus state
      var canvasHasFocus = false;
      
      // Check if the Module is fully initialized
      function isModuleReady() {
        return typeof Module !== 'undefined' && 
               Module.ready === true && 
               typeof Module._malloc === 'function' && 
               typeof Module._free === 'function' &&
               typeof Module.HEAPU8 !== 'undefined';
      }
      
      // Wait for the Module to be ready
      function waitForModule(callback, timeout = 10000) {
        if (isModuleReady()) {
          callback();
          return;
        }
        
        const startTime = Date.now();
        const interval = setInterval(() => {
          if (isModuleReady()) {
            clearInterval(interval);
            callback();
          } else if (Date.now() - startTime > timeout) {
            clearInterval(interval);
            console.error('Module initialization timed out');
            alert('Error: Module initialization timed out. Please refresh the page and try again.');
          }
        }, 100);
      }
      
      // Update the keyboard notice based on focus state
      function updateKeyboardNotice() {
        if (canvasHasFocus) {
          keyboardNotice.className = 'keyboard-notice focus';
          keyboardNotice.textContent = 'Keyboard input enabled';
        } else {
          keyboardNotice.className = 'keyboard-notice no-focus';
          keyboardNotice.textContent = 'Click the screen to enable keyboard input';
        }
      }
      
      // Event listeners for focus tracking
      canvas.addEventListener('click', function() {
        canvas.focus();
        canvasHasFocus = true;
        updateKeyboardNotice();
      });
      
      window.addEventListener('blur', function() {
        canvasHasFocus = false;
        updateKeyboardNotice();
      });
      
      document.addEventListener('click', function(e) {
        if (e.target !== canvas) {
          canvasHasFocus = false;
          updateKeyboardNotice();
        }
      });
      
      // Global variable to track current ROM
      var currentRom = 'internal';
      
      // Helper function to wait for HEAPU8 to be available
      function ensureHeapAvailable(callback, maxAttempts = 10) {
        let attempts = 0;
        
        function checkHeap() {
          if (typeof Module.HEAPU8 !== 'undefined') {
            console.log('HEAPU8 is available, proceeding with ROM loading');
            callback();
            return;
          }
          
          attempts++;
          if (attempts >= maxAttempts) {
            console.error('Failed to initialize Module.HEAPU8 after multiple attempts');
            alert('Could not initialize WebAssembly memory. Please refresh the page.');
            return;
          }
          
          console.log('Waiting for HEAPU8 to be available (attempt ' + attempts + ')');
          setTimeout(checkHeap, 300);
        }
        
        checkHeap();
      }
      
      // Load ROM handler
      loadRomButton.addEventListener('click', function() {
        var selectedRom = romSelect.value;
        
        waitForModule(function() {
          ensureHeapAvailable(function() {
            if (selectedRom === 'internal') {
              // Load internal ROM (this is the default)
              Module.ccall('loadInternalRom', null, [], []);
              console.log('Loaded internal ROM');
            } else {
              // Fetch and load external ROM
              fetch(selectedRom)
                .then(response => {
                  if (!response.ok) {
                    throw new Error('Network response was not ok');
                  }
                  return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                  var romData = new Uint8Array(arrayBuffer);
                  var size = romData.length;
                  
                  // Check if HEAPU8 is available
                  if (!Module.HEAPU8) {
                    throw new Error('Module memory is not initialized. Please try again later.');
                  }
                  
                  // Allocate memory for the ROM data
                  var romPtr = Module._malloc(size);
                  if (!romPtr) {
                    throw new Error('Failed to allocate memory for ROM data');
                  }
                  
                  // Copy the ROM data to the allocated memory
                  Module.HEAPU8.set(romData, romPtr);
                  
                  // Call the C++ function to load the ROM
                  Module.ccall('loadExternalRom', null, ['number', 'number'], [romPtr, size]);
                  
                  // Free the memory
                  Module._free(romPtr);
                  
                  console.log('Loaded ROM:', selectedRom, 'Size:', size);
                })
                .catch(error => {
                  console.error('Error loading ROM:', error);
                  alert('Error loading ROM: ' + error.message);
                });
            }
          });
        });
      });

      var Module = {
        preRun: [
          function() {
            console.log("Module preRun setup");
          }
        ],
        postRun: [
          function() {
            console.log("Module postRun setup");
            // Ensure we have module initialization
            Module.ready = true;
            
            // Auto-load the jonsharp.net ROM on startup
            setTimeout(function() {
              if (typeof Module.ccall === 'function') {
                Module.ccall('loadInternalRom', null, [], []);
                console.log('Auto-loaded JonSharp.net ROM on startup');
              }
            }, 500);
          }
        ],
        print: (function() {
          var element = document.getElementById('output');
          if (element) element.value = ''; // clear browser cache
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; // focus on bottom
            }
          };
        })(),
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may ant to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
          
          // Signal that module is ready when all dependencies are loaded
          if (left === 0) {
            console.log('Module dependencies loaded, waiting for full initialization');
            
            // Wait for 1 second to ensure everything is initialized
            setTimeout(function() {
              if (typeof Module.HEAPU8 !== 'undefined') {
                Module.ready = true;
                console.log('Module initialization complete with memory access');
              } else {
                console.warn('Module memory not initialized yet, will try again');
                // Try again in 500ms
                setTimeout(function() {
                  Module.ready = true;
                  console.log('Module initialization complete (second attempt)');
                }, 500);
              }
            }, 1000);
          }
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = function(text) {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
