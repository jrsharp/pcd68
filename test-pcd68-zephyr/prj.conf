# PCD-68 Emulator Test Configuration
CONFIG_ZTEST=y

# Increase stack size for emulator (64000 CPU emulator needs large stack)
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ZTEST_STACK_SIZE=32768

# Heap for dynamic allocation (for multiple 16KB test RAM allocations)
# 104 tests * 16KB = ~1.6MB, but many will fail early
# Allocate 384KB to allow ~24 tests to run
CONFIG_HEAP_MEM_POOL_SIZE=393216

# Enable console for test output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Enable assertions
CONFIG_ASSERT=y

# Logging (optional, can disable for speed)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Enable newlib for proper C++ new/delete
CONFIG_NEWLIB_LIBC=n
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=y
